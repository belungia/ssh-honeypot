# Базовый шаблон ФС: read-only основа гибридной VFS.
# Все изменения, которые делает атакующий, живут только в overlay сессии.
entries:
  # ---- skeleton --------------------------------------------------------
  /:                {type: dir}
  /bin:             {type: dir}
  /boot:            {type: dir}
  /dev:             {type: dir}
  /dev/null:        {type: file, content: ""}
  /etc:             {type: dir}
  /etc/ssh:         {type: dir}
  /etc/network:     {type: dir}
  /etc/cron.d:      {type: dir}
  /etc/cron.daily:  {type: dir}
  /etc/cron.hourly: {type: dir}
  /home:            {type: dir}
  /lib:             {type: dir}
  /lib/x86_64-linux-gnu: {type: dir}
  /media:           {type: dir}
  /mnt:             {type: dir}
  /opt:             {type: dir}
  /proc:            {type: dir}
  /root:            {type: dir}
  /run:             {type: dir}
  /sbin:            {type: dir}
  /srv:             {type: dir}
  /sys:             {type: dir}
  /tmp:             {type: dir}
  /usr:             {type: dir}
  /usr/bin:         {type: dir}
  /usr/sbin:        {type: dir}
  /usr/local:       {type: dir}
  /usr/local/bin:   {type: dir}
  /usr/share:       {type: dir}
  /var:             {type: dir}
  /var/log:         {type: dir}
  /var/spool:       {type: dir}
  /var/spool/cron:  {type: dir}
  /var/spool/cron/crontabs: {type: dir}
  /var/www:         {type: dir}
  /var/www/html:    {type: dir}
  /var/mail:        {type: dir}

  # ---- /etc ------------------------------------------------------------
  /etc/hostname:
    type: file
    content: "srv-prod-01\n"
  /etc/hosts:
    type: file
    content: |
      127.0.0.1   localhost
      127.0.1.1   srv-prod-01
      ::1         localhost ip6-localhost ip6-loopback
      ff02::1     ip6-allnodes
      ff02::2     ip6-allrouters
  /etc/passwd:
    type: file
    content: |
      root:x:0:0:root:/root:/bin/bash
      daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
      bin:x:2:2:bin:/bin:/usr/sbin/nologin
      sys:x:3:3:sys:/dev:/usr/sbin/nologin
      sync:x:4:65534:sync:/bin:/bin/sync
      www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin
      backup:x:34:34:backup:/var/backups:/usr/sbin/nologin
      sshd:x:108:65534::/run/sshd:/usr/sbin/nologin
      systemd-network:x:101:102:systemd Network Management,,,:/run/systemd:/usr/sbin/nologin
      ubuntu:x:1000:1000:Ubuntu,,,:/home/ubuntu:/bin/bash
  /etc/group:
    type: file
    content: |
      root:x:0:
      daemon:x:1:
      bin:x:2:
      sys:x:3:
      adm:x:4:syslog
      tty:x:5:
      sudo:x:27:ubuntu
      www-data:x:33:
      ssh:x:114:
      ubuntu:x:1000:
  /etc/shadow:
    type: file
    content: |
      root:$6$Yp1g7yLb$x.....placeholder.....:19500:0:99999:7:::
      daemon:*:19500:0:99999:7:::
      bin:*:19500:0:99999:7:::
      sshd:!:19500:0:99999:7:::
      ubuntu:$6$ZZZ$y.....placeholder.....:19500:0:99999:7:::
  /etc/issue:
    type: file
    content: "Ubuntu 22.04.3 LTS \\n \\l\n"
  /etc/os-release:
    type: file
    content: |
      PRETTY_NAME="Ubuntu 22.04.3 LTS"
      NAME="Ubuntu"
      VERSION_ID="22.04"
      VERSION="22.04.3 LTS (Jammy Jellyfish)"
      VERSION_CODENAME=jammy
      ID=ubuntu
      ID_LIKE=debian
      HOME_URL="https://www.ubuntu.com/"
      SUPPORT_URL="https://help.ubuntu.com/"
      BUG_REPORT_URL="https://bugs.launchpad.net/ubuntu/"
      UBUNTU_CODENAME=jammy
  /etc/lsb-release:
    type: file
    content: |
      DISTRIB_ID=Ubuntu
      DISTRIB_RELEASE=22.04
      DISTRIB_CODENAME=jammy
      DISTRIB_DESCRIPTION="Ubuntu 22.04.3 LTS"
  /etc/resolv.conf:
    type: file
    content: |
      # Generated by systemd-resolved
      nameserver 127.0.0.53
      options edns0 trust-ad
      search .
  /etc/crontab:
    type: file
    content: |
      SHELL=/bin/sh
      PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

      17 *    * * *   root    cd / && run-parts --report /etc/cron.hourly
      25 6    * * *   root    test -x /usr/sbin/anacron || ( cd / && run-parts --report /etc/cron.daily )
      47 6    * * 7   root    test -x /usr/sbin/anacron || ( cd / && run-parts --report /etc/cron.weekly )
      52 6    1 * *   root    test -x /usr/sbin/anacron || ( cd / && run-parts --report /etc/cron.monthly )
  /etc/sudoers:
    type: file
    content: |
      Defaults        env_reset
      Defaults        mail_badpass
      Defaults        secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      root    ALL=(ALL:ALL) ALL
      %sudo   ALL=(ALL:ALL) ALL
      #includedir /etc/sudoers.d
  /etc/network/interfaces:
    type: file
    content: |
      auto lo
      iface lo inet loopback

      auto eth0
      iface eth0 inet dhcp
  /etc/ssh/sshd_config:
    type: file
    content: |
      Port 22
      PermitRootLogin yes
      PasswordAuthentication yes
      PubkeyAuthentication yes
      X11Forwarding no
      ChallengeResponseAuthentication no
      UsePAM yes
      Subsystem sftp /usr/lib/openssh/sftp-server
  /etc/motd:
    type: file
    content: |
      Welcome to Ubuntu 22.04.3 LTS (GNU/Linux 5.15.0-91-generic x86_64)

       * Documentation:  https://help.ubuntu.com
       * Support:        https://ubuntu.com/advantage

  # ---- /proc -----------------------------------------------------------
  /proc/cpuinfo:
    type: file
    content: |
      processor       : 0
      vendor_id       : GenuineIntel
      cpu family      : 6
      model           : 158
      model name      : Intel(R) Xeon(R) CPU @ 2.30GHz
      stepping        : 10
      microcode       : 0xffffffff
      cpu MHz         : 2300.000
      cache size      : 33792 KB
      physical id     : 0
      siblings        : 4
      core id         : 0
      cpu cores       : 2
      bogomips        : 4600.00
      cache_alignment : 64
      address sizes   : 46 bits physical, 48 bits virtual
  /proc/meminfo:
    type: file
    content: |
      MemTotal:        2048124 kB
      MemFree:         1085412 kB
      MemAvailable:    1462128 kB
      Buffers:           45120 kB
      Cached:           482392 kB
      SwapTotal:       2097148 kB
      SwapFree:        2097148 kB
  /proc/version:
    type: file
    content: |
      Linux version 5.15.0-91-generic (buildd@lcy02-amd64-031) (gcc-11 (Ubuntu 11.4.0-1ubuntu1~22.04) 11.4.0, GNU ld (GNU Binutils for Ubuntu) 2.38) #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023
  /proc/uptime:
    type: file
    content: "2073847.12 8195232.40\n"
  /proc/mounts:
    type: file
    content: |
      /dev/sda1 / ext4 rw,relatime,errors=remount-ro 0 0
      proc /proc proc rw,nosuid,nodev,noexec,relatime 0 0
      sysfs /sys sysfs rw,nosuid,nodev,noexec,relatime 0 0
      tmpfs /run tmpfs rw,nosuid,nodev,size=204852k,mode=755 0 0
      devpts /dev/pts devpts rw,nosuid,noexec,relatime,gid=5,mode=620 0 0

  # ---- /root -----------------------------------------------------------
  /root/.bashrc:
    type: file
    content: |
      # ~/.bashrc: executed by bash(1) for non-login shells.
      export PS1='\u@\h:\w\# '
      export HISTSIZE=1000
      export HISTFILESIZE=2000
      alias ll='ls -alF'
      alias la='ls -A'
      alias l='ls -CF'
  /root/.profile:
    type: file
    content: |
      if [ -n "$BASH_VERSION" ]; then
          if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc"
          fi
      fi
      export PATH="$PATH:$HOME/bin"
  /root/.bash_history:
    type: file
    content: ""
  /root/.ssh:
    type: dir

  # ---- /var/log --------------------------------------------------------
  /var/log/auth.log:
    type: file
    content: ""
  /var/log/syslog:
    type: file
    content: ""
  /var/log/dpkg.log:
    type: file
    content: ""
  /var/log/wtmp:
    type: file
    content: ""
