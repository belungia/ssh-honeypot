[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot"
version = "0.1.0"
description = "SSH honeypot for network attack detection (coursework)"
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.14",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
